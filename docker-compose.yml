services:
  car-status-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: car_status_app
    ports:
      - "8088:80"  # สามารถปรับเปลี่ยนพอร์ตได้ตามต้องการ เช่น 8088 หรือ 18088
    restart: always

  car-status-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: car_status_backend
    env_file:
      - ./backend/.env
    environment:
      # Credentials come from the root .env file (never committed) — see .env.example.
      # If the password has URL-special characters (@ : / # ?), percent-encode them here.
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@car-status-postgres:5432/${POSTGRES_DB:-car_status}"
      PORT: 4000
    ports:
      # host 4002 — container listens on 4000 internally
      - "4002:4000"
    depends_on:
      car-status-postgres:
        condition: service_healthy
    restart: always

  car-status-postgres:
    image: postgres:16.15-alpine
    container_name: car_status_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-car_status}
      # :? makes `docker compose up` stop with this message instead of
      # silently starting a database with an empty/default password.
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env (copy .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
    ports:
      # Bound to 127.0.0.1 only: the backend reaches Postgres over the internal
      # Docker network, so no other machine on the LAN needs (or gets) direct
      # database access. Tools like Prisma Studio/DBeaver still work on this host.
      - "127.0.0.1:5432:5432"
    volumes:
      - car_status_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

volumes:
  car_status_pg_data:
