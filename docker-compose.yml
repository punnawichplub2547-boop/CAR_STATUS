services:
  car-status-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: car_status_app
    ports:
      - "8088:80"  # สามารถปรับเปลี่ยนพอร์ตได้ตามต้องการ เช่น 8088 หรือ 18088
    restart: always

  car-status-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: car_status_backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "postgresql://car_user:car_password@car-status-postgres:5432/car_status"
      PORT: 4000
    ports:
      # host 4002 — container listens on 4000 internally
      - "4002:4000"
    depends_on:
      car-status-postgres:
        condition: service_healthy
    restart: always

  car-status-postgres:
    image: postgres:17-alpine
    container_name: car_status_postgres
    environment:
      POSTGRES_DB: car_status
      POSTGRES_USER: car_user
      POSTGRES_PASSWORD: car_password
    ports:
      - "5432:5432"
    volumes:
      - car_status_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U car_user -d car_status"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

volumes:
  car_status_pg_data:
